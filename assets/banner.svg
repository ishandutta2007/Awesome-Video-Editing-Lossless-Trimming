<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filter for soft neon glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      
      /* Subtle ambient pulse animations */
      @keyframes playheadMove {
        0% { transform: translateX(0px); }
        50% { transform: translateX(280px); }
        100% { transform: translateX(0px); }
      }
      @keyframes floatSlow {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.7; }
      }
      @keyframes waveBar {
        0%, 100% { height: 18px; y: 300px; }
        50% { height: 38px; y: 280px; }
      }

      .playhead-anim {
        animation: playheadMove 9s ease-in-out infinite;
      }
      .floating-badge {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .ambient-glow {
        animation: glowPulse 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay in Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Background Lighting Orbs (Behind Content) -->
  <circle cx="180" cy="100" r="140" fill="#6366f1" opacity="0.22" filter="url(#glow)" class="ambient-glow" />
  <circle cx="1020" cy="220" r="160" fill="#ec4899" opacity="0.18" filter="url(#glow)" class="ambient-glow" />
  <circle cx="620" cy="300" r="120" fill="#06b6d4" opacity="0.16" filter="url(#glow)" />

  <!-- Stylized Video Timeline in Background at Bottom -->
  <g opacity="0.75">
    <!-- Timeline Ruler -->
    <rect x="70" y="275" width="1060" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    
    <!-- Video Track Block 1 -->
    <rect x="90" y="284" width="220" height="18" rx="4" fill="#3b82f6" opacity="0.8" />
    <text x="100" y="297" font-size="10" fill="#ffffff" font-family="monospace">CLIP_01.MP4 [COPY]</text>

    <!-- Cut Marker / Trim Point -->
    <line x1="316" y1="280" x2="316" y2="306" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="2 2" />

    <!-- Video Track Block 2 (Stream Copy) -->
    <rect x="322" y="284" width="360" height="18" rx="4" fill="#8b5cf6" opacity="0.8" />
    <text x="332" y="297" font-size="10" fill="#ffffff" font-family="monospace">LOSSLESS_STREAM_COPY [GOP KEYFRAME]</text>

    <!-- Cut Marker 2 -->
    <line x1="688" y1="280" x2="688" y2="306" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="2 2" />

    <!-- Video Track Block 3 -->
    <rect x="694" y="284" width="240" height="18" rx="4" fill="#06b6d4" opacity="0.8" />
    <text x="704" y="297" font-size="10" fill="#ffffff" font-family="monospace">SMARTCUT_EXPORT.MKV</text>

    <!-- Audio Waveform Bars Sub-track -->
    <rect x="90" y="309" width="844" height="16" rx="3" fill="#0f172a" stroke="#1e293b" />
    <g fill="#10b981" opacity="0.7">
      <rect x="100" y="313" width="3" height="8" rx="1" />
      <rect x="110" y="311" width="3" height="12" rx="1" />
      <rect x="120" y="314" width="3" height="6" rx="1" />
      <rect x="130" y="312" width="3" height="10" rx="1" />
      <rect x="150" y="310" width="3" height="14" rx="1" />
      <rect x="170" y="312" width="3" height="10" rx="1" />
      <rect x="190" y="314" width="3" height="6" rx="1" />
      <rect x="220" y="311" width="3" height="12" rx="1" />
      <rect x="250" y="310" width="3" height="14" rx="1" />
      <rect x="330" y="312" width="3" height="10" rx="1" />
      <rect x="360" y="311" width="3" height="12" rx="1" />
      <rect x="400" y="310" width="3" height="14" rx="1" />
      <rect x="440" y="313" width="3" height="8" rx="1" />
      <rect x="520" y="311" width="3" height="12" rx="1" />
      <rect x="580" y="310" width="3" height="14" rx="1" />
      <rect x="640" y="312" width="3" height="10" rx="1" />
      <rect x="710" y="311" width="3" height="12" rx="1" />
      <rect x="760" y="314" width="3" height="6" rx="1" />
      <rect x="820" y="310" width="3" height="14" rx="1" />
      <rect x="880" y="312" width="3" height="10" rx="1" />
    </g>

    <!-- Animated Playhead -->
    <g class="playhead-anim">
      <line x1="280" y1="270" x2="280" y2="338" stroke="#f43f5e" stroke-width="2.5" filter="url(#subtleGlow)" />
      <polygon points="274,268 286,268 280,277" fill="#f43f5e" />
    </g>
  </g>

  <!-- Badges / Dynamic Pills in Header (Below main text line) -->
  <g class="floating-badge" transform="translate(0, 0)">
    <!-- Pill 1: Zero Re-encode -->
    <g transform="translate(70, 42)">
      <rect width="180" height="30" rx="15" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="15" r="5" fill="#22c55e" />
      <text x="32" y="20" class="pill-text">⚡ Zero Re-encoding</text>
    </g>

    <!-- Pill 2: Stream Copy -->
    <g transform="translate(262, 42)">
      <rect width="184" height="30" rx="15" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="15" r="5" fill="#a855f7" />
      <text x="32" y="20" class="pill-text">✂️ Keyframe Trimming</text>
    </g>

    <!-- Pill 3: FFmpeg Native -->
    <g transform="translate(458, 42)">
      <rect width="170" height="30" rx="15" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="15" r="5" fill="#06b6d4" />
      <text x="32" y="20" class="pill-text">🎞️ FFmpeg &amp; NLEs</text>
    </g>

    <!-- Pill 4: Open Source + SaaS -->
    <g transform="translate(640, 42)">
      <rect width="210" height="30" rx="15" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="15" r="5" fill="#ec4899" />
      <text x="32" y="20" class="pill-text">🌟 SaaS &amp; Open-Source</text>
    </g>
  </g>

  <!-- FOREGROUND: Main Title and Subtitle (Unobscured and crisp) -->
  <g>
    <!-- Main Title -->
    <text x="70" y="145" class="title-text" font-size="44" fill="#ffffff" filter="url(#subtleGlow)">
      Awesome Video Editing &amp;
    </text>
    <text x="70" y="196" class="title-text" font-size="44" fill="url(#primaryGlow)">
      Lossless Trimming Ecosystem
    </text>

    <!-- Subtitle Line -->
    <text x="72" y="240" class="subtitle-text" font-size="17" fill="#94a3b8">
      Curated directory of ultra-fast stream-copy cutters, keyframe smart-rendering NLEs, and AI video editors
    </text>
  </g>

  <!-- Tech Badges / Cut Icon Graphic on Right Side -->
  <g transform="translate(1010, 110)">
    <circle cx="50" cy="50" r="52" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" opacity="0.8" />
    <!-- Stylized Scissor / Cut Icon -->
    <path d="M38 32 C34 32 30 35 30 40 C30 44 33 47 37 48 L46 52 L37 56 C33 57 30 60 30 64 C30 69 34 72 38 72 C42 72 45 70 47 66 L58 48 L68 34" stroke="#a855f7" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M47 38 L68 70" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
    <circle cx="38" cy="40" r="4" fill="none" stroke="#a855f7" stroke-width="2.5" />
    <circle cx="38" cy="64" r="4" fill="none" stroke="#a855f7" stroke-width="2.5" />
  </g>
</svg>
